name: smart_queue
description: Smart Appointment Scheduling and Queue Management App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network
  connectivity_plus: ^5.0.2

  # Utilities
  uuid: ^4.2.2
  intl: ^0.18.1
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # UI
  flutter_slidable: ^3.0.1
  google_fonts: ^6.1.0
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
